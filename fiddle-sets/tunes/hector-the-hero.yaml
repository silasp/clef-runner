id: hector-the-hero
title: Hector the Hero
display_title: "1. Hector the Hero  (slow air · Scotland · J. Scott Skinner)"
composer: James Scott Skinner (1843–1927) — public domain
origin: Scotland
type: slow air
meter: 3/4
key: A
unit: 1/8
tempo: {bpm: 54, beat_ql: 1.0, text: "Slow air — freely"}
form: [P, Q, P, Q, R, S, R, S]     # full traditional form
sources:
  - name: The Session, setting 1292 (in D)
    url: https://thesession.org/tunes/1292#setting1292
    notes: >
      Transposed D → A (Skinner's published key) so the tune sits on the A and
      E strings and leaves room underneath for a second fiddle. Slides dropped;
      grace notes and rolls kept. Slurred "ties" between repeated notes
      written as real ties. The 8-bar strains are labelled P Q (A part) and
      R S (B part); S is the B part's second half, which reprises Q's ending.
range: [A4, A5]
motifs:
  head:      {abc: "AB | {B}c4 (3B/c/B/ A", note: "rising pickup into a long 3rd, turn figure falling to the tonic"}
  sigh:      {abc: "f2 (3gfe c2", note: "high 6th falling through a triplet — the tune's emotional peak gesture"}
  cadence:   {abc: "B4 {cB}A2 | A6", note: "2→1 sigh cadence"}
  b-lift:    {abc: "(3efg a g", note: "triplet run up to the top A that opens the B part"}
